
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperChess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 22px;
  background: #17243a;
}

h1 {
  margin: 0;
  color: #f5c451;
  font-size: 38px;
}

main {
  width: min(95%, 560px);
  margin: 25px auto;
}

#status {
  background: #24344e;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 15px;
  font-size: 17px;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: 100%;
  aspect-ratio: 1;
  border: 5px solid #29384e;
  border-radius: 5px;
  overflow: hidden;
}

.square {
  border: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(24px, 8vw, 52px);
  cursor: pointer;
  position: relative;
}

.light { background: #f0d9b5; }
.dark { background: #b58863; }

.selected {
  background: #e9d44b !important;
}

.target::after {
  content: "";
  width: 22%;
  height: 22%;
  border-radius: 50%;
  background: #287b45;
  position: absolute;
}

button.action {
  border: 0;
  padding: 12px 17px;
  margin: 7px 3px;
  border-radius: 9px;
  background: #f5c451;
  color: #17243a;
  font-weight: bold;
  cursor: pointer;
}

button.action:hover { background: #ffda78; }

.panel {
  margin-top: 20px;
  padding: 17px;
  border-radius: 12px;
  background: #1c2a40;
}

#qrcode {
  background: white;
  padding: 10px;
  width: fit-content;
  margin: 12px auto;
}

#invite {
  width: 100%;
  padding: 10px;
  border-radius: 7px;
  border: 0;
}

.small {
  color: #bdc9da;
  font-size: 13px;
}
</style>
</head>

<body>
<header>
  <h1>♟ SuperChess</h1>
  <p>Spiele Schach mit deinen Freunden</p>
</header>

<main>
  <div id="status">Spiel wird geladen ...</div>

  <div id="board"></div>

  <div>
    <button class="action" onclick="newGame()">Neues Spiel</button>
    <button class="action" onclick="flipBoard()">Brett drehen</button>
  </div>

  <div class="panel">
    <h2>Freund einladen</h2>
    <p id="connection">Verbindung wird vorbereitet ...</p>
    <div id="qrcode"></div>
    <input id="invite" readonly placeholder="Einladungslink erscheint hier">
    <button class="action" onclick="copyInvite()">Link kopieren</button>
    <p class="small">Teile den Link oder QR-Code mit deinem Freund.</p>
  </div>
</main>

<script>
const game = new Chess();

const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const connectionBox = document.getElementById("connection");
const inviteInput = document.getElementById("invite");

const pieces = {
  wK:"♔", wQ:"♕", wR:"♖", wB:"♗", wN:"♘", wP:"♙",
  bK:"♚", bQ:"♛", bR:"♜", bB:"♝", bN:"♞", bP:"♟"
};

let peer;
let connection = null;
let role = "waiting";
let selected = null;
let legalTargets = [];
let flipped = false;

const params = new URLSearchParams(location.search);
const hostId = params.get("join");

function start() {
  if (typeof Chess === "undefined" ||
      typeof Peer === "undefined" ||
      typeof QRCode === "undefined") {
    statusBox.textContent =
      "Fehler: Eine Bibliothek konnte nicht geladen werden. Bitte Seite neu laden.";
    return;
  }

  peer = new Peer();

  peer.on("open", id => {
    if (hostId) {
      role = "guest";
      connectionBox.textContent = "Verbinde mit dem Spiel ...";
      connection = peer.connect(hostId, { reliable: true });
      setupConnection(connection);
    } else {
      role = "host";
      connectionBox.textContent = "Du bist Spieler Weiß. Warte auf deinen Freund.";
      const url = location.origin + location.pathname + "?join=" + id;
      inviteInput.value = url;

      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 180,
        height: 180
      });
    }

    render();
  });

  peer.on("connection", conn => {
    if (role !== "host") return;

    if (connection && connection.open) {
      conn.close();
      return;
    }

    connection = conn;
    setupConnection(conn);
  });

  peer.on("error", err => {
    connectionBox.textContent = "Verbindungsfehler: " + err.type;
  });
}

function setupConnection(conn) {
  conn.on("open", () => {
    connectionBox.textContent =
      role === "host" ? "Freund verbunden! Du spielst Weiß." :
      "Verbunden! Du spielst Schwarz.";

    if (role === "host") sendState();
  });

  conn.on("data", data => {
    if (role === "host" && data.type === "move") {
      if (game.turn() !== "b") return;

      const move = game.move({
        from: data.from,
        to: data.to,
        promotion: "q"
      });

      if (move) sendState();
    }

    if (role === "guest" && data.type === "state") {
      game.load(data.fen);
      selected = null;
      legalTargets = [];
      render();
    }

    if (role === "guest" && data.type === "reset") {
      game.reset();
      render();
    }
  });

  conn.on("close", () => {
    connectionBox.textContent = "Verbindung getrennt.";
  });
}

function sendState() {
  if (connection && connection.open) {
    connection.send({
      type: "state",
      fen: game.fen()
    });
  }
}

function render() {
  board.innerHTML = "";

  const files = flipped
    ? ["h","g","f","e","d","c","b","a"]
    : ["a","b","c","d","e","f","g","h"];

  const ranks = flipped
    ? ["1","2","3","4","5","6","7","8"]
    : ["8","7","6","5","4","3","2","1"];

  ranks.forEach((rank, row) => {
    files.forEach((file, col) => {
      const square = file + rank;
      const piece = game.get(square);

      const cell = document.createElement("button");
      cell.className = "square " +
        ((row + col) % 2 === 0 ? "light" : "dark");

      if (selected === square) cell.classList.add("selected");
      if (legalTargets.includes(square)) cell.classList.add("target");

      if (piece) {
        cell.textContent = pieces[piece.color + piece.type.toUpperCase()];
      }

      cell.onclick = () => clickSquare(square);
      board.appendChild(cell);
    });
  });

  updateStatus();
}

function clickSquare(square) {
  const piece = game.get(square);
  const myColor = role === "host" ? "w" : "b";

  if (role === "waiting") return;
  if (game.game_over()) return;
  if (game.turn() !== myColor) return;

  if (selected && legalTargets.includes(square)) {
    makeMove(selected, square);
    selected = null;
    legalTargets = [];
    render();
    return;
  }

  if (piece && piece.color === myColor) {
    selected = square;
    legalTargets = game.moves({
      square: square,
      verbose: true
    }).map(move => move.to);
  } else {
    selected = null;
    legalTargets = [];
  }

  render();
}

function makeMove(from, to) {
  if (role === "host") {
    const move = game.move({
      from: from,
      to: to,
      promotion: "q"
    });

    if (move) sendState();
  } else if (connection && connection.open) {
    connection.send({
      type: "move",
      from: from,
      to: to
    });
  }
}

function updateStatus() {
  if (game.in_checkmate()) {
    statusBox.textContent = "Schachmatt! " +
      (game.turn() === "w" ? "Schwarz" : "Weiß") + " gewinnt!";
  } else if (game.in_draw()) {
    statusBox.textContent = "Unentschieden!";
  } else {
    statusBox.textContent =
      (game.turn() === "w" ? "Weiß" : "Schwarz") + " ist am Zug" +
      (game.in_check() ? " – Schach!" : "");
  }
}

function newGame() {
  if (role !== "host") {
    statusBox.textContent = "Nur Spieler Weiß kann ein neues Spiel starten.";
    return;
  }

  game.reset();
  selected = null;
  legalTargets = [];

  if (connection && connection.open) {
    connection.send({ type: "reset" });
    sendState();
  }

  render();
}

function flipBoard() {
  flipped = !flipped;
  render();
}

function copyInvite() {
  if (!inviteInput.value) return;

  inviteInput.select();
  navigator.clipboard.writeText(inviteInput.value)
    .then(() => {
      connectionBox.textContent = "Einladungslink kopiert!";
    })
    .catch(() => {
      connectionBox.textContent = "Bitte den Link manuell kopieren.";
    });
}

render();
start();
</script>
</body>
</html>
