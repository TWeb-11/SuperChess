
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Chess – Online Schach</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: linear-gradient(135deg,#101827,#202d50);
  color: white;
  font-family: Arial,sans-serif;
  text-align: center;
}

.container {
  max-width: 520px;
  margin: auto;
}

h1 {
  color: #70e0a0;
  font-size: 38px;
}

.panel {
  background: #202d40;
  padding: 15px;
  border-radius: 12px;
  margin: 15px 0;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 18px;
  margin: 5px;
  background: #70e0a0;
  color: #102018;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#board {
  display: grid;
  grid-template-columns: repeat(8,1fr);
  width: min(92vw,440px);
  margin: 20px auto;
  border: 5px solid #303d50;
}

.square {
  aspect-ratio: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(25px,8vw,48px);
  cursor: pointer;
  user-select: none;
  position: relative;
}

.light { background: #f0d9b5; }
.dark { background: #b58863; }

.selected {
  background: #baca44 !important;
}

.target::after {
  content: "";
  position: absolute;
  width: 25%;
  height: 25%;
  border-radius: 50%;
  background: #276b36aa;
}

.capture::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 5px solid #276b36aa;
  border-radius: 50%;
}

#status {
  font-size: 17px;
  font-weight: bold;
  color: #70e0a0;
}

#qr {
  display: flex;
  justify-content: center;
  margin: 15px;
}

#invite {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  background: #101827;
  color: white;
  border: 1px solid #718096;
}

#history {
  overflow-wrap: anywhere;
  font-size: 13px;
  color: #ccd5e2;
}

.small {
  color: #aab7c9;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>♟ QR CHESS</h1>
<p>Fordere deine Freunde zum Schach heraus!</p>

<div class="panel">
  <div id="status">Erstelle eine Partie oder tritt einer bei.</div>
  <p id="connection">Nicht verbunden</p>
</div>

<button onclick="createGame()">♔ Spiel erstellen</button>
<button onclick="joinGame()">♚ Spiel beitreten</button>

<div class="panel" id="inviteArea" hidden>
  <h3>📱 Freunde einladen</h3>
  <div id="qr"></div>
  <input id="invite" readonly>
  <button onclick="copyInvite()">Link kopieren</button>
</div>

<div id="board"></div>

<div class="panel">
  <div id="turn">Warte auf ein Spiel...</div>
  <p id="history">Züge erscheinen hier.</p>
</div>

<button onclick="undoMove()" id="undoButton" disabled>↩ Letzten Zug zurücknehmen</button>
<button onclick="newGame()" id="newButton" disabled>🔄 Neue Partie</button>

<p class="small">QR CHESS · ONLINE MULTIPLAYER</p>

</div>

<script>
const chess = new Chess();

const icons = {
  wp:"♙",wn:"♘",wb:"♗",wr:"♖",wq:"♕",wk:"♔",
  bp:"♟",bn:"♞",bb:"♝",br:"♜",bq:"♛",bk:"♚"
};

let peer = null;
let connection = null;
let color = null;
let selected = null;
let connected = false;
let history = [];

const board = document.getElementById("board");

function draw() {
  board.innerHTML = "";

  const files = "abcdefgh";

  for (let r=0;r<8;r++) {
    for (let c=0;c<8;c++) {
      const square = files[c]+(8-r);
      const piece = chess.get(square);
      const div = document.createElement("div");

      div.className = "square " +
        ((r+c)%2===0 ? "light":"dark");

      if (selected===square)
        div.classList.add("selected");

      if (selected) {
        const possible = chess.moves({
          square:selected,
          verbose:true
        }).find(m=>m.to===square);

        if (possible)
          div.classList.add(piece ? "capture":"target");
      }

      if (piece) {
        div.textContent = icons[
          piece.color + piece.type
        ];
      }

      div.onclick = () => clickSquare(square);
      board.appendChild(div);
    }
  }

  updateStatus();
}

function updateStatus() {
  let message = chess.turn()==="w" ? "Weiß" : "Schwarz";

  if (chess.isCheckmate()) {
    message = "♚ SCHACHMATT! " +
      (chess.turn()==="w" ? "Schwarz" : "Weiß") +
      " gewinnt!";
  } else if (chess.in_draw()) {
    message = "Partie unentschieden!";
  } else {
    message += " ist am Zug.";
    if (chess.in_check()) message += " SCHACH!";
  }

  document.getElementById("status").textContent = message;

  document.getElementById("turn").textContent =
    "Du spielst: " +
    (color==="w" ? "Weiß" :
     color==="b" ? "Schwarz" : "Zuschauer");

  document.getElementById("history").textContent =
    chess.pgn() || "Noch keine Züge.";

  document.getElementById("undoButton").disabled =
    !connected || !history.length || chess.game_over();

  document.getElementById("newButton").disabled =
    !connected || color!=="w";
}

function clickSquare(square) {
  if (!connected || chess.game_over()) return;
  if (chess.turn()!==color) return;

  const piece = chess.get(square);

  if (!selected) {
    if (piece && piece.color===color) {
      selected=square;
      draw();
    }
    return;
  }

  if (piece && piece.color===color) {
    selected=square;
    draw();
    return;
  }

  sendMove(selected,square);
}

function sendMove(from,to) {
  if (color==="w") {
    makeMove(from,to);
  } else {
    connection.send({
      type:"move",
      from:from,
      to:to,
      promotion:"q"
    });
  }
  selected=null;
  draw();
}

function makeMove(from,to,promotion="q") {
  const move=chess.move({
    from:from,
    to:to,
    promotion:promotion
  });

  if (!move) return false;

  history.push(move);
  broadcastState();
  draw();
  return true;
}

function broadcastState() {
  if (connection && connection.open) {
    connection.send({
      type:"state",
      fen:chess.fen(),
      pgn:chess.pgn()
    });
  }
}

function setupConnection(conn) {
  connection=conn;

  conn.on("open",()=>{
    connected=true;

    document.getElementById("connection").textContent =
      "🟢 Freund verbunden!";

    if (color==="w") broadcastState();

    draw();
  });

  conn.on("data",data=>{

    // Gast sendet einen Zug an Weiß
    if (data.type==="move" && color==="w") {
      if (chess.turn()!=="b") return;

      makeMove(data.from,data.to,data.promotion);
    }

    // Weiß überträgt den Spielstand an Schwarz
    if (data.type==="state" && color==="b") {
      try {
        chess.load(data.fen);
        history=[];
        selected=null;
        draw();
      } catch(e) {
        console.error("Ungültiger Spielstand",e);
      }
    }

    // Neue Partie
    if (data.type==="reset" && color==="b") {
      chess.reset();
      history=[];
      selected=null;
      draw();
    }

    // Letzten Zug zurücknehmen
    if (data.type==="undo" && color==="b") {
      chess.undo();
      history=[];
      selected=null;
      draw();
    }
  });

  conn.on("close",()=>{
    connected=false;
    document.getElementById("connection").textContent =
      "🔴 Verbindung getrennt";
    draw();
  });
}

function createGame() {
  if (peer) peer.destroy();

  color="w";
  chess.reset();
  history=[];
  selected=null;
  connected=false;

  peer=new Peer();

  document.getElementById("status").textContent =
    "Erstelle deine Einladung...";

  peer.on("open",id=>{

    const url=new URL(location.href);
    url.search="";
    url.searchParams.set("join",id);

    document.getElementById("inviteArea").hidden=false;
    document.getElementById("invite").value=url.toString();

    document.getElementById("qr").innerHTML="";

    new QRCode(document.getElementById("qr"),{
      text:url.toString(),
      width:200,
      height:200
    });

    document.getElementById("connection").textContent =
      "Warte auf deinen Freund...";

    draw();
  });

  peer.on("connection",conn=>{
    if (connection && connection.open) {
      conn.close();
      return;
    }
    setupConnection(conn);
  });

  peer.on("error",e=>{
    document.getElementById("status").textContent =
      "Fehler: "+e.type;
  });
}

function joinGame() {
  const id=new URLSearchParams(location.search).get("join")
    || prompt("Einladungs-ID eingeben:");

  if (!id) return;

  if (peer) peer.destroy();

  color="b";
  chess.reset();
  history=[];
  selected=null;
  connected=false;

  peer=new Peer();

  document.getElementById("status").textContent =
    "Verbinde mit deinem Freund...";

  peer.on("open",()=>{
    const conn=peer.connect(id,{reliable:true});
    setupConnection(conn);
  });

  peer.on("error",()=>{
    document.getElementById("status").textContent =
      "Verbindung fehlgeschlagen. Einladung prüfen.";
  });

  draw();
}

function newGame() {
  if (color!=="w" || !connected) return;

  chess.reset();
  history=[];
  selected=null;

  connection.send({type:"reset"});
  broadcastState();
  draw();
}

function undoMove() {
  if (!connected || !history.length) return;

  if (color==="w") {
    chess.undo();
    history.pop();
    connection.send({type:"undo"});
    broadcastState();
    draw();
  }
}

function copyInvite() {
  const input=document.getElementById("invite");
  input.select();
  navigator.clipboard.writeText(input.value);
  document.getElementById("status").textContent =
    "Einladungslink kopiert!";
}

// Automatisch beitreten, wenn QR-Link geöffnet wird
if (new URLSearchParams(location.search).has("join")) {
  joinGame();
} else {
  draw();
}
</script>

</body>
</html>
