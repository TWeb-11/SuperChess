<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperChess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --page: #0b1220;
  --panel: #172338;
  --panel2: #22324b;
  --gold: #f4c45e;
  --muted: #b9c6d8;
}
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #1b2d49 0%, var(--page) 65%);
  color: #f7f9fc;
  font-family: system-ui, Arial, sans-serif;
  text-align: center;
}
header {
  padding: 24px 14px 18px;
  background: rgba(10,18,32,.72);
  border-bottom: 1px solid #30415b;
}
h1 { margin: 0; color: var(--gold); font-size: clamp(30px, 7vw, 42px); }
header p { margin: 7px 0 0; color: var(--muted); }
main { width: min(94%, 650px); margin: 22px auto 40px; }

#status {
  background: linear-gradient(135deg, #263954, #1b2a40);
  border: 1px solid #405572;
  border-radius: 14px;
  padding: 14px 12px;
  margin: 0 auto 16px;
  font-weight: 700;
  min-height: 52px;
  display: grid;
  place-items: center;
}

.board-wrap {
  width: min(560px, calc(100vw - 30px));
  aspect-ratio: 1 / 1;
  margin: auto;
  padding: 7px;
  border-radius: 13px;
  background: linear-gradient(135deg, #d5b77c, #5b4630);
  box-shadow: 0 16px 38px rgba(0,0,0,.38);
}
#board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-template-rows: repeat(8, minmax(0, 1fr));
  overflow: hidden;
  border-radius: 7px;
}
.square {
  min-width: 0;
  min-height: 0;
  border: 0;
  padding: 0;
  display: grid;
  place-items: center;
  position: relative;
  cursor: pointer;
  line-height: 1;
  font-family: "Segoe UI Symbol", "DejaVu Sans", serif;
  font-size: clamp(25px, 8.1vw, 57px);
}
.square:hover { filter: brightness(1.08); }
.light { background: #f3e5c9; color: #fffdf7; }
.dark { background: #a97850; color: #fffdf7; }
.square .piece {
  display: block;
  transform: translateY(-1px);
  text-shadow: 0 2px 2px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.5);
  -webkit-text-stroke: .6px rgba(20,20,20,.65);
  pointer-events: none;
}
.square .coord {
  position: absolute;
  left: 4px;
  top: 3px;
  font: 700 clamp(8px, 1.8vw, 11px)/1 system-ui, sans-serif;
  color: rgba(20,28,38,.68);
}
.square.selected { background: #e6c84f !important; }
.square.lastmove { box-shadow: inset 0 0 0 4px rgba(255,225,90,.55); }
.square.target::after {
  content: "";
  position: absolute;
  width: 25%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: rgba(22,101,52,.72);
}
.square.capture-target::after {
  width: 82%;
  background: transparent;
  border: 5px solid rgba(22,101,52,.68);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 15px 0;
}
.action {
  border: 0;
  padding: 12px 17px;
  border-radius: 10px;
  background: var(--gold);
  color: #17243a;
  font-weight: 800;
  cursor: pointer;
  font-size: 14px;
}
.action:hover { filter: brightness(1.08); }
.resign { background: #d84d58; color: white; }
.newgame { background: #48c58a; color: #082b1b; }

.panel {
  margin-top: 19px;
  padding: 19px;
  border: 1px solid #344963;
  border-radius: 15px;
  background: rgba(23,35,56,.94);
  box-shadow: 0 10px 26px rgba(0,0,0,.18);
}
.panel h2 { margin: 0 0 8px; color: var(--gold); }
#connection { color: var(--muted); min-height: 22px; }
#qrcode {
  background: white;
  padding: 10px;
  width: fit-content;
  min-height: 0;
  margin: 14px auto;
  border-radius: 8px;
}
#qrcode:empty { display: none; }
#qrcode img, #qrcode canvas { display: block; }
#invite {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #536782;
  background: #f7f9fc;
  color: #17243a;
  margin-bottom: 8px;
  font-size: 13px;
}
.small { color: var(--muted); font-size: 13px; line-height: 1.5; }
#promotion {
  display: none;
  background: var(--panel2);
  padding: 13px;
  border-radius: 12px;
  margin: 12px auto;
}
.promotion-button {
  font-size: 30px;
  margin: 4px;
  width: 54px;
  height: 54px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  background: #f2e5ca;
  color: #182234;
}
#newGameAction { display: none; }
@media (max-width: 380px) {
  main { width: 96%; }
  .board-wrap { width: calc(100vw - 20px); padding: 5px; }
  .square { font-size: 24px; }
  .action { padding: 11px 13px; }
}
</style>
</head>

<body>
<header>
  <h1>♟ SuperChess</h1>
  <p>Schach mit Freunden spielen</p>
</header>

<main>
  <div id="status">Spiel wird geladen ...</div>

  <div class="board-wrap">
    <div id="board" aria-label="Schachbrett"></div>
  </div>

  <div id="promotion">
    <p>Welche Figur möchtest du wählen?</p>
    <button class="promotion-button" onclick="promote('q')">♕</button>
    <button class="promotion-button" onclick="promote('r')">♖</button>
    <button class="promotion-button" onclick="promote('b')">♗</button>
    <button class="promotion-button" onclick="promote('n')">♘</button>
  </div>

  <div class="controls">
    <button class="action" onclick="flipBoard()">Brett drehen</button>
    <button class="action resign" onclick="resign()">Aufgeben</button>
  </div>

  <div class="panel">
    <h2 id="panelTitle">Spiel verbinden</h2>
    <p id="connection">Verbindung wird vorbereitet ...</p>
    <div id="qrcode"></div>
    <input id="invite" readonly placeholder="Dein Einladungslink">

    <div class="controls">
      <button class="action" onclick="copyInvite()">Link kopieren</button>
      <button class="action newgame" onclick="newInvite()" id="newGameAction">
        Neue Partie + QR-Code
      </button>
    </div>

    <p class="small">
      Teile den QR-Code oder den Einladungslink mit deinem Freund.
      Nach Schachmatt oder Aufgabe könnt ihr hier eine neue Partie starten.
    </p>
  </div>
</main>

<script>
const game = new Chess();

const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const connectionBox = document.getElementById("connection");
const inviteInput = document.getElementById("invite");
const promotionBox = document.getElementById("promotion");
const newGameAction = document.getElementById("newGameAction");
const panelTitle = document.getElementById("panelTitle");

const pieces = {
  wK:"♔", wQ:"♕", wR:"♖", wB:"♗", wN:"♘", wP:"♙",
  bK:"♚", bQ:"♛", bR:"♜", bB:"♝", bN:"♞", bP:"♟"
};

let peer = null;
let connection = null;
let role = "waiting";
let selected = null;
let legalTargets = [];
let flipped = false;
let pendingPromotion = null;
let ended = false;
let resultText = "";
let remoteStatus = "";
let lastMove = null;

let hostId = new URLSearchParams(location.search).get("join");

function getStatus() {
  if (ended) return resultText;

  if (game.in_checkmate()) {
    return "Schachmatt! " +
      (game.turn() === "w" ? "Schwarz" : "Weiß") + " gewinnt!";
  }

  if (game.in_stalemate()) return "Patt! Unentschieden.";
  if (game.insufficient_material()) return "Remis: Nicht genügend Material.";
  if (game.in_threefold_repetition()) return "Remis: Dreifache Stellungswiederholung.";
  if (game.in_draw()) return "Remis!";

  return (game.turn() === "w" ? "Weiß" : "Schwarz") +
    " ist am Zug" + (game.in_check() ? " – Schach!" : "");
}

function finishIfNeeded() {
  if (!game.game_over()) return false;

  resultText = getStatus();
  ended = true;
  selected = null;
  legalTargets = [];
  pendingPromotion = null;
  promotionBox.style.display = "none";

  newGameAction.style.display = "inline-block";
  panelTitle.textContent = "Partie beendet";
  connectionBox.textContent =
    "Die Partie ist beendet. Starte eine neue Partie und teile den neuen QR-Code.";

  sendState();
  return true;
}

function render() {
  board.innerHTML = "";

  const files = flipped
    ? ["h","g","f","e","d","c","b","a"]
    : ["a","b","c","d","e","f","g","h"];

  const ranks = flipped
    ? ["1","2","3","4","5","6","7","8"]
    : ["8","7","6","5","4","3","2","1"];

  ranks.forEach((rank, row) => {
    files.forEach((file, col) => {
      const square = file + rank;
      const piece = game.get(square);
      const cell = document.createElement("button");

      cell.type = "button";
      cell.className = "square " +
        ((row + col) % 2 === 0 ? "light" : "dark");

      if (selected === square) cell.classList.add("selected");

      if (lastMove &&
          (lastMove.from === square || lastMove.to === square)) {
        cell.classList.add("lastmove");
      }

      if (legalTargets.includes(square)) {
        cell.classList.add("target");
        if (piece) cell.classList.add("capture-target");
      }

      if (piece) {
        const span = document.createElement("span");
        span.className = "piece";
        span.textContent = pieces[piece.color + piece.type.toUpperCase()];
        cell.appendChild(span);
      }

      if (col === 0 || row === 7) {
        const coord = document.createElement("span");
        coord.className = "coord";
        coord.textContent = col === 0 ? rank : file;
        cell.appendChild(coord);
      }

      cell.onclick = () => clickSquare(square);
      board.appendChild(cell);
    });
  });

  statusBox.textContent =
    role === "guest" && remoteStatus && !ended
      ? remoteStatus
      : getStatus();
}

function start() {
  if (typeof Chess === "undefined" ||
      typeof Peer === "undefined" ||
      typeof QRCode === "undefined") {
    statusBox.textContent =
      "Fehler beim Laden der Spielbibliotheken. Bitte Internetverbindung prüfen.";
    return;
  }

  peer = new Peer();

  peer.on("open", id => {
    if (hostId && role === "waiting") {
      role = "guest";
      connectionBox.textContent = "Verbinde mit Spieler Weiß ...";
      connection = peer.connect(hostId, { reliable: true });
      setupConnection(connection);
    } else {
      role = "host";
      connectionBox.textContent =
        "Du spielst Weiß. Warte auf einen Freund.";
      makeQrCode(id);
    }

    render();
  });

  peer.on("connection", conn => {
    if (role !== "host") {
      conn.close();
      return;
    }

    if (connection && connection.open) {
      conn.close();
      return;
    }

    connection = conn;
    setupConnection(conn);
  });

  peer.on("error", err => {
    connectionBox.textContent =
      "Verbindungsfehler: " + err.type +
      ". Erstelle bei Bedarf einen neuen QR-Code.";
  });
}

function makeQrCode(id) {
  const url = location.origin + location.pathname + "?join=" + id;
  inviteInput.value = url;

  const qr = document.getElementById("qrcode");
  qr.innerHTML = "";

  new QRCode(qr, {
    text: url,
    width: 190,
    height: 190
  });

  newGameAction.style.display =
    ended ? "inline-block" : "none";
}

function setupConnection(conn) {
  conn.on("open", () => {
    connectionBox.textContent =
      role === "host"
        ? "Freund verbunden! Du bist Weiß."
        : "Verbunden! Du bist Schwarz.";

    if (role === "host") sendState();
  });

  conn.on("data", data => {
    if (!data || !data.type) return;

    if (role === "host" && data.type === "move") {
      if (ended || game.turn() !== "b") return;

      const move = game.move({
        from: data.from,
        to: data.to,
        promotion: data.promotion || "q"
      });

      if (move) {
        lastMove = { from: move.from, to: move.to };
        finishIfNeeded();
        sendState();
        render();
      }
    }

    if (role === "guest" && data.type === "state") {
      game.load(data.fen);
      ended = !!data.ended;
      resultText = data.result || "";
      remoteStatus = data.status || "";

      selected = null;
      legalTargets = [];
      pendingPromotion = null;
      promotionBox.style.display = "none";

      if (ended) {
        newGameAction.style.display = "inline-block";
        panelTitle.textContent = "Partie beendet";
        connectionBox.textContent =
          "Die Partie ist beendet. Starte eine neue Partie für einen neuen QR-Code.";
      }

      render();
    }

    if (role === "host" && data.type === "resign") {
      ended = true;
      resultText = "Schwarz hat aufgegeben. Weiß gewinnt!";

      newGameAction.style.display = "inline-block";
      panelTitle.textContent = "Partie beendet";
      connectionBox.textContent =
        "Die Partie ist beendet. Erstelle eine neue Partie für einen neuen QR-Code.";

      sendState();
      render();
    }
  });

  conn.on("close", () => {
    connectionBox.textContent = "Verbindung getrennt.";
  });
}

function sendState() {
  if (connection && connection.open) {
    connection.send({
      type: "state",
      fen: game.fen(),
      status: getStatus(),
      ended: ended,
      result: resultText
    });
  }
}

function clickSquare(square) {
  if (ended || pendingPromotion || role === "waiting") return;

  const myColor = role === "host" ? "w" : "b";

  if (game.turn() !== myColor) return;

  const piece = game.get(square);

  if (piece && piece.color === myColor) {
    selected = square;

    legalTargets = game.moves({
      square: square,
      verbose: true
    }).map(move => move.to);

    render();
    return;
  }

  if (!selected) return;

  const moves = game.moves({
    square: selected,
    verbose: true
  }).filter(move => move.to === square);

  if (!moves.length) {
    selected = null;
    legalTargets = [];
    render();
    return;
  }

  if (moves.some(move => move.promotion)) {
    pendingPromotion = {
      from: selected,
      to: square
    };

    promotionBox.style.display = "block";
    return;
  }

  makeMove(selected, square, "q");
}

function promote(piece) {
  if (!pendingPromotion) return;

  makeMove(
    pendingPromotion.from,
    pendingPromotion.to,
    piece
  );

  pendingPromotion = null;
  promotionBox.style.display = "none";
}

function makeMove(from, to, promotion) {
  if (ended) return;

  if (role === "host") {
    const move = game.move({
      from: from,
      to: to,
      promotion: promotion
    });

    if (move) {
      lastMove = { from: move.from, to: move.to };
      selected = null;
      legalTargets = [];

      finishIfNeeded();
      sendState();
      render();
    }
  } else if (role === "guest" && connection && connection.open) {
    connection.send({
      type: "move",
      from: from,
      to: to,
      promotion: promotion
    });

    selected = null;
    legalTargets = [];
    statusBox.textContent = "Zug wird übertragen ...";
    render();
  }
}

function resign() {
  if (ended || role === "waiting") return;
  if (!confirm("Möchtest du wirklich aufgeben?")) return;

  ended = true;

  if (role === "host") {
    resultText = "Weiß hat aufgegeben. Schwarz gewinnt!";
    sendState();
  } else {
    resultText =
      "Du hast aufgegeben. Schwarz gibt auf – Weiß gewinnt!";

    if (connection && connection.open) {
      connection.send({ type: "resign" });
    }
  }

  selected = null;
  legalTargets = [];

  newGameAction.style.display = "inline-block";
  panelTitle.textContent = "Partie beendet";
  connectionBox.textContent =
    "Die Partie ist beendet. Erstelle eine neue Partie für einen neuen QR-Code.";

  render();
}

function newInvite() {
  if (!ended && role !== "waiting" &&
      !confirm("Aktuelle Partie beenden und eine neue Partie starten?")) {
    return;
  }

  if (peer) {
    peer.destroy();
    peer = null;
  }

  connection = null;
  role = "waiting";
  hostId = null;
  ended = false;
  resultText = "";
  remoteStatus = "";
  selected = null;
  legalTargets = [];
  pendingPromotion = null;
  flipped = false;
  lastMove = null;

  game.reset();

  promotionBox.style.display = "none";
  inviteInput.value = "";
  document.getElementById("qrcode").innerHTML = "";

  history.replaceState(null, "", location.pathname);

  newGameAction.style.display = "none";
  panelTitle.textContent = "Neue Partie";
  connectionBox.textContent = "Erstelle einen neuen QR-Code ...";
  statusBox.textContent = "Neue Partie wird vorbereitet ...";

  render();
  start();
}

function flipBoard() {
  flipped = !flipped;
  render();
}

function copyInvite() {
  if (!inviteInput.value) {
    connectionBox.textContent =
      "Erstelle zuerst einen QR-Code.";
    return;
  }

  inviteInput.select();

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(inviteInput.value)
      .then(() => {
        connectionBox.textContent = "Einladungslink kopiert!";
      })
      .catch(() => {
        connectionBox.textContent =
          "Bitte kopiere den Link manuell.";
      });
  } else {
    connectionBox.textContent =
      "Bitte kopiere den Link manuell.";
  }
}

render();
start();
</script>
</body>
</html>
